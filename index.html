  function SnowEffect() {
    const canvasRef = useRef(null);
    useEffect(() => {
      const canvas = canvasRef.current;
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;
      
      const snowflakes = Array.from({ length: 40 }, () => ({
        x: Math.random() * width, y: Math.random() * height - height,
        size: Math.random() * 3 + 2, speed: Math.random() * 1 + 0.8,
        opacity: Math.random() * 0.5 + 0.4, swingSpeed: Math.random() * 0.02 + 0.01,
        angle: Math.random() * Math.PI * 2
      }));

      let animationId;
      const animate = () => {
        ctx.clearRect(0, 0, width, height);
        snowflakes.forEach(flake => {
          flake.y += flake.speed; flake.angle += flake.swingSpeed;
          flake.x += Math.sin(flake.angle) * 0.8;
          if (flake.y > height) { flake.y = -10; flake.x = Math.random() * width; }
          ctx.beginPath(); ctx.arc(flake.x, flake.y, flake.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${flake.opacity})`; ctx.fill();
        });
        animationId = requestAnimationFrame(animate);
      };
      animate();

      const handleResize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
      window.addEventListener('resize', handleResize);
      return () => { cancelAnimationFrame(animationId); window.removeEventListener('resize', handleResize); };
    }, []);
    return <canvas ref={canvasRef} id="snow-canvas" />;
  }

              <div ref={guideScrollRef} style={{ padding: '22px', overflowY: 'auto', flex: 1, backgroundColor: '#f8fafc' }}>
                <div style={{ background: '#e0f2fe', padding: '12px', borderRadius: '12px', fontSize: '13px', color: '#0369a1', fontWeight: 900, marginBottom: '20px', border: '2px dashed #7dd3fc', lineHeight: 1.5 }}>
                  💡 總結：從機場 B1 買票上車 ➔ 抵達東京站後從 B5 上樓到 1F ➔ 兩張票疊在一起刷進新幹線 ➔ 再上 2F 候車。
                </div>
                <div style={{ fontWeight: 900, color: '#b91c1c', marginBottom: '8px', fontSize: '16px' }}>📍 第一步：機場購票與劃位</div>
                <ul style={{ margin: '0 0 20px 0', paddingLeft: '24px', fontSize: '14px', color: '#334155', fontWeight: 'bold', lineHeight: 1.6 }}>
                  <li><span style={{color: '#0369a1'}}>前往 B1：</span>出海關後搭電梯到地下 1 樓。</li>
                  <li><span style={{color: '#0369a1'}}>劃位：</span>買 N'EX 優惠票並劃位。</li>
                </ul>
                <div style={{ fontWeight: 900, color: '#b91c1c', marginBottom: '8px', fontSize: '16px' }}>📍 核心：B5 上 2F</div>
                <ul style={{ margin: '0 0 15px 0', paddingLeft: '24px', fontSize: '14px', color: '#334155', fontWeight: 'bold', lineHeight: 1.6 }}>
                  <li>N'EX 停 B5，跟著<strong style={{color: '#047857'}}>綠底白字「新幹線」指標</strong>上 1F。</li>
                  <li>將「N'EX車票」與「新幹線車票」<strong style={{color: '#ef4444'}}>疊在一起</strong>同時放入剪票機！</li>
                  <li>上 2F 月台候車出發！</li>
                </ul>
              </div>
              <div style={{ padding: '15px 20px', background: 'white', borderTop: '1px solid #e2e8f0', display: 'flex', justifyContent: 'center' }}>
                <button onClick={() => setShowTransferGuide(false)} style={{ background: '#ef4444', color: 'white', border: '2px solid #b91c1c', padding: '12px 40px', borderRadius: '25px', fontWeight: 900, fontSize: '16px', cursor: 'pointer', boxShadow: '0 4px 0 #b91c1c' }}>✖ 關閉視窗</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
